name: Bug report
description: Report a reproducible problem in Prompt paste.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a problem. Do not include Prompt contents, tokens, or other secrets.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic Prompt text and provide the smallest reliable reproduction.
      placeholder: |
        1. Create a category...
        2. Add a Prompt...
        3. Right-click...
    validations:
      required: true
  - type: dropdown
    id: editor
    attributes:
      label: Editor type
      options:
        - input
        - textarea
        - contenteditable or rich-text editor
        - Other or unknown
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version
      placeholder: "Example: 140.0.7339.81"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Example: macOS 15.6 or Windows 11"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional context
      description: Add sanitized console errors, screenshots, or a public test-page URL if useful.
