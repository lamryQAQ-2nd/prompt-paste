name: Feature request
description: Suggest a focused improvement to Prompt paste.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest change that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or different designs have you tried?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy expectations
      options:
        - label: This proposal can preserve the local-first design and avoid analytics or external runtime services.
          required: true
